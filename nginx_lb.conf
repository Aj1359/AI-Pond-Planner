user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/geo+json;

    upstream pond_backends {
        least_conn;
        server 172.17.0.19:4000 max_fails=3 fail_timeout=15s;
        server 172.17.0.20:4000 max_fails=3 fail_timeout=15s;
        server 172.17.0.21:4001 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 4000;
        server_name _;

        location /ui/ {
            alias /var/www/pond_planner/frontend/;
            index index.html;
            try_files $uri $uri/ /ui/index.html;
        }

        # Route EVERYTHING else to the backend 
        location / {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 60s;
        }
    }
}
