name: CI/CD Pipeline — JalSetu Studio AI Pond Planner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "ai-pond-planner-backend"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: LINT & UNIT TESTS (CI)
  # ───────────────────────────────────────────────────────────────────────────
  test-and-lint:
    name: 🧪 Run Code Quality & Pytest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: 🔍 Lint Code Syntax with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: 🚀 Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v --junitxml=test-results.xml

      - name: 📊 Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: DOCKER CONTAINER BUILD & REGISTRY PUSH (GHCR)
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: 🏗 Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: AUTOMATED DEPLOYMENT (RENDER / VM SSH)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy to Render Web Service (via Deploy Hook)
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: 🖥 Deploy to VM via SSH (Optional)
        if: secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/AI-Pond-Planner
            git pull origin main
            cd backend
            docker build -t ai-pond-planner .
            docker stop pond_planner || true
            docker rm pond_planner || true
            docker run -d --name pond_planner -p 8000:8000 ai-pond-planner
