name: CI/CD Pipeline — JalSetu Studio AI Pond Planner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "ai-pond-planner-backend"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: COMPILE & UNIT TEST SUITE (CI)
  # ───────────────────────────────────────────────────────────────────────────
  compile-and-test:
    name: 🧪 Compile Dependencies & Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Compile & Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: 🔍 Lint Code Syntax with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level quality checks
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: 🚀 Execute Pytest Automated Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v --junitxml=test-results.xml

      - name: 📊 Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: DOCKER IMAGE COMPILE & GHCR BUILD (CD)
  # ───────────────────────────────────────────────────────────────────────────
  docker-compile-build:
    name: 🐳 Compile & Build Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: compile-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: 🏗 Compile & Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
