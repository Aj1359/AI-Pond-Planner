worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstream pool (Backend worker nodes on VM2, VM3, VM4) ─────────────────
    upstream pond_backends {
        least_conn;

        server 172.17.0.19:4000 weight=1 max_fails=3 fail_timeout=15s;   # VM2
        server 172.17.0.20:4000 weight=1 max_fails=3 fail_timeout=15s;   # VM3
        server 172.17.0.21:4000 weight=1 max_fails=3 fail_timeout=15s;   # VM4

        keepalive 16;
    }

    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format pond_log '$remote_addr - $upstream_addr [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/pond_access.log pond_log;
    error_log  /var/log/nginx/pond_error.log warn;

    # ── Server block ─────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen 4217 default_server;
        server_name _;

        client_max_body_size 20M;

        root /var/www/pond_planner/frontend;
        index index.html;

        # 1. Frontend Static Files (Served directly by Nginx with fallbacks)
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location /ui/ {
            alias /var/www/pond_planner/frontend/;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location = /ui {
            return 301 /ui/;
        }

        # 2. Backend API Endpoints (Proxied to FastAPI Backend Pool)
        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                return 204;
            }
            add_header Access-Control-Allow-Origin *;

            proxy_pass         http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Backend-Node   $upstream_addr;

            proxy_connect_timeout 5s;
            proxy_read_timeout    120s;

            limit_req zone=api_limit burst=30 nodelay;
        }

        location /analyzeContour {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Health & Swagger Documentation
        location /health {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
