# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — AI Pond Planner Load Balancer
# Deploy on VM 1 (stu5_sys1)
#
# Backends on:
#   VM2 (stu5_sys2) — internal port 4000
#   VM3 (stu5_sys3) — internal port 4000
#   VM4 (stu5_sys4) — internal port 4000
#
# Lab NAT: external port 4218 on VM1 is exposed to the outside world.
# Internal IPs are on the lab LAN (10.1.x.x).  Adjust if needed.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstream pool (3 backends, round-robin by default) ───────────────────
    upstream pond_backends {
        # Weighted least-connection — routes new requests to the least-busy server
        least_conn;

        server 10.1.75.52:4000 weight=1 max_fails=3 fail_timeout=30s;   # VM2
        server 10.1.75.53:4000 weight=1 max_fails=3 fail_timeout=30s;   # VM3
        server 10.1.75.54:4000 weight=1 max_fails=3 fail_timeout=30s;   # VM4

        # Keepalive connections to backends (reduces TCP handshake overhead)
        keepalive 16;
    }

    # ── Shared cache zone (nginx-level, in front of backend cache) ───────────
    proxy_cache_path /var/cache/nginx/pond levels=1:2
                     keys_zone=pond_cache:10m
                     max_size=500m
                     inactive=1h
                     use_temp_path=off;

    # ── Rate limiting (protect backends under stress) ────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format pond_log '$remote_addr - $upstream_addr [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'cache=$upstream_cache_status '
                        'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/pond_access.log pond_log;
    error_log  /var/log/nginx/pond_error.log warn;

    # ── Server block ─────────────────────────────────────────────────────────
    server {
        listen 4218;          # external NAT port — matches the lab assignment
        server_name _;

        client_max_body_size 20M;  # allow KML file uploads

        # CORS preflight
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                return 204;
            }
            add_header Access-Control-Allow-Origin *;

            proxy_pass         http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Backend-Node   $upstream_addr;

            # Timeouts (DEM fetch + D8 can take a few seconds)
            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;

            # Rate limit on heavy API routes
            limit_req zone=api_limit burst=20 nodelay;
        }

        # ── Cache GET /api/map/analyze-area results at nginx level ───────────
        location = /api/map/analyze-area {
            # POST requests are not cacheable by default — use cache key on body hash
            # For simplicity we cache only repeated identical POSTs via the
            # backend Supabase cache; nginx caches GET health/docs endpoints.
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            add_header Access-Control-Allow-Origin *;
        }

        # ── Static frontend files served directly from nginx ─────────────────
        location /ui/ {
            alias /var/www/pond_planner/frontend/;
            index index.html;
            try_files $uri $uri/ /ui/index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ── Health check endpoint ─────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"lb":"ok","backends":["vm2","vm3","vm4"]}';
            add_header Content-Type application/json;
        }

        # ── Swagger docs passthrough ──────────────────────────────────────────
        location /docs {
            proxy_pass http://pond_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
